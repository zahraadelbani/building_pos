{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto p-6">

    <h1 class="text-3xl font-bold text-red-700 mb-6">
        REFUND ORDER #{{ order.order_number }}
    </h1>

    <div class="bg-white p-6 rounded shadow">

        <div class="text-xl mb-4">
            Total Amount: <strong>{{ total }}</strong>
        </div>

        <div class="bg-red-100 text-red-800 p-4 rounded mb-6 text-lg">
            ⚠️ This action is <strong>PERMANENT</strong>.<br>
            This order will be marked as REFUNDED.<br>
            It cannot be printed or paid again.
        </div>

        <form method="post" class="flex gap-4">
            {% csrf_token %}

            <button type="submit"
                    class="bg-red-700 text-white px-6 py-3 rounded text-xl font-bold">
                CONFIRM REFUND
            </button>

            <a href="{% url 'pos_home' %}"
               class="bg-gray-600 text-white px-6 py-3 rounded text-xl font-bold">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
