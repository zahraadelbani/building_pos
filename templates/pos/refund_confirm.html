{% extends "base.html" %}
{% load pos_filters %}
{% block content %}

<div class="max-w-xl mx-auto p-6">
    <h1 class="text-2xl md:text-3xl font-extrabold text-red-800 mb-6 tracking-tight">
        REFUND ORDER #{{ order.order_number }}
    </h1>

    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex items-center justify-between mb-5">
            <div class="text-sm font-semibold text-slate-500 uppercase tracking-wide">Total amount</div>
            <div class="text-3xl font-extrabold text-slate-900 tabular-nums">{{ total|whole }}</div>
        </div>

        <div class="bg-red-50 border border-red-200 text-red-900 p-4 rounded-xl mb-6 text-base font-semibold">
            WARNING: This action is <span class="font-extrabold">PERMANENT</span>.<br>
            The order will be marked as <span class="font-extrabold">REFUNDED</span>.<br>
            Refunded orders cannot be printed.
        </div>

        <form method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {% csrf_token %}

            <button type="submit"
                    class="bg-red-800 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-red-900">
                CONFIRM REFUND
            </button>

            <a href="{% url 'pos_home' %}"
               class="bg-slate-700 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-slate-800 text-center">
                Cancel
            </a>
        </form>
    </div>
</div>

{% endblock %}
