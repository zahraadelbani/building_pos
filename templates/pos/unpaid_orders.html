{% extends "base.html" %}
{% load pos_filters %}
{% block content %}

<div class="max-w-6xl mx-auto p-6">

    <div class="flex items-end justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-900">Unpaid Orders</h1>
            <div class="text-sm text-slate-500">Search and reopen an unpaid bill.</div>
        </div>
        <a href="{% url 'pos_home' %}" class="px-4 py-2 rounded-lg border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50">
            Back to POS
        </a>
    </div>

    <form method="get" class="mb-6 flex gap-3">
        <input type="text" name="q"
               value="{{ query }}"
               placeholder="Search by order number"
               class="border border-slate-200 p-3 rounded-xl text-base flex-1 bg-white">

        <button class="bg-slate-900 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-slate-800">
            Search
        </button>
    </form>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <table class="w-full text-base">
        <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
                <th class="p-3 text-left text-xs uppercase tracking-wide text-slate-500">Order</th>
                <th class="p-3 text-right text-xs uppercase tracking-wide text-slate-500">Total</th>
                <th class="p-3 text-center text-xs uppercase tracking-wide text-slate-500">Action</th>
            </tr>
        </thead>
        <tbody>
            {% for o in orders %}
            <tr class="border-b border-slate-100">
                <td class="p-3 font-semibold text-slate-900">#{{ o.order_number }}</td>
                <td class="p-3 text-right font-semibold text-slate-900 tabular-nums">{{ o.total_amount|whole }}</td>
                <td class="p-3 text-center">
                    <a href="{% url 'resume_order' o.id %}"
                       class="bg-slate-900 text-white px-4 py-2 rounded-lg font-extrabold hover:bg-slate-800 inline-block">
                        Reopen
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="p-6 text-center text-gray-500">
                    No unpaid orders
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    </div>

</div>

{% endblock %}
