{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto p-6">

    <h1 class="text-3xl font-bold mb-6">
        Pay Order #{{ order.order_number }}
    </h1>

    <div class="bg-white p-6 rounded shadow">

        <div class="text-2xl font-bold mb-4">
            Total: <span class="text-green-700">{{ total }}</span>
        </div>

        {% if error %}
            <div class="bg-red-100 text-red-800 p-4 rounded mb-4 text-lg">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-lg font-semibold mb-1">Payment Method</label>
                <select name="method" required class="w-full border p-3 rounded text-lg">
                    <option value="">-- Select --</option>
                    <option value="cash">Cash</option>
                    <option value="bank">Bank Transfer</option>
                    <option value="wave">Wave</option>
                    <option value="aps">APS</option>
                </select>
            </div>

            <div>
                <label class="block text-lg font-semibold mb-1">Amount Received</label>
                <input type="number" step="0.01" name="amount_received"
                       class="w-full border p-3 rounded text-lg"
                       required>
            </div>

            <div>
                <label class="block text-lg font-semibold mb-1">
                    Bank Name (Bank Transfer only)
                </label>
                <input type="text" name="bank_name"
                       class="w-full border p-3 rounded text-lg">
            </div>

            <div class="flex gap-4">
                <button type="submit"
                        class="bg-green-700 text-white px-6 py-3 rounded text-xl font-bold">
                    CONFIRM PAYMENT
                </button>

                <a href="{% url 'pos_order' order.id %}"
                   class="bg-gray-600 text-white px-6 py-3 rounded text-xl font-bold">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
