{% extends "base.html" %}
{% load pos_filters %}
{% block content %}

<div class="max-w-xl mx-auto p-6">

    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight mb-6 text-slate-900">
        Pay Order #{{ order.order_number }}
    </h1>

    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">

        <div class="flex items-center justify-between mb-6">
            <div class="text-sm font-semibold text-slate-500 uppercase tracking-wide">Total due</div>
            <div class="text-3xl font-extrabold text-emerald-700 tabular-nums">{{ total|whole }}</div>
        </div>

        {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-800 p-4 rounded-xl mb-4 text-base font-semibold">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Payment method</label>
                <select name="method" required class="w-full border border-slate-200 p-3 rounded-xl text-base bg-white">
                    <option value="">-- Select --</option>
                    <option value="cash">Cash</option>
                    <option value="bank">Bank Transfer</option>
                    <option value="wave">Wave</option>
                    <option value="aps">APS</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">Amount received</label>
                <input type="number" step="1" name="amount_received"
                       class="w-full border border-slate-200 p-3 rounded-xl text-base bg-white"
                       required>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1 text-slate-700">
                    Bank Name (Bank Transfer only)
                </label>
                <input type="text" name="bank_name"
                       class="w-full border border-slate-200 p-3 rounded-xl text-base bg-white">
            </div>

            <div class="flex gap-4">
                <button type="submit"
                        class="bg-teal-700 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-teal-800">
                    CONFIRM PAYMENT
                </button>

                <a href="{% url 'pos_order' order.id %}"
                   class="bg-slate-700 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-slate-800">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>

{% endblock %}
