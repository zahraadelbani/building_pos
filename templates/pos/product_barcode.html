<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barcode for {{ product.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 16px;
        }
        .label {
            width: 60mm;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .name {
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }
        .code-text {
            font-size: 11px;
            letter-spacing: 0.08em;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid #0f172a;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            background: #fff;
            color: #0f172a;
        }
        .bi {
            font-style: normal;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            min-width: 1em;
        }
        .bi-printer::before { content: "🖨"; }
        .bi-x-lg::before { content: "✕"; }
        .bi::before { content: none !important; }
        .bi svg {
            width: 1.1em;
            height: 1.1em;
            display: block;
        }
        @media print {
            body {
                padding: 0;
            }
            .actions {
                display: none;
            }
            .label {
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="label">
        <div class="name">{{ product.name }}</div>
        <svg id="barcode"></svg>
        <div class="code-text">#{{ product.code }}</div>
    </div>

    <div class="actions">
        <button class="btn" onclick="window.print()"><span style="display:inline-flex;align-items:center;gap:6px;"><i class="bi bi-printer"></i><span>Print</span></span></button>
        <button class="btn btn-secondary" onclick="window.close()"><span style="display:inline-flex;align-items:center;gap:6px;"><i class="bi bi-x-lg"></i><span>Close</span></span></button>
    </div>

    <script>
        (function () {
            const fallbackMap = {
                "bi-printer": '<path d="M4 2h8v4H4z"/><path d="M4 11H2V7h12v4h-2"/><path d="M5 10h6v4H5z"/>',
                "bi-x-lg": '<path d="m4 4 8 8"/><path d="m12 4-8 8"/>',
            };
            document.querySelectorAll("i.bi").forEach(function (icon) {
                for (const cls in fallbackMap) {
                    if (icon.classList.contains(cls)) {
                        icon.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + fallbackMap[cls] + '</svg>';
                        break;
                    }
                }
            });
        })();
    </script>

    <script>
        (function () {
            const code = "{{ product.code }}";
            if (!code) return;
            JsBarcode("#barcode", code, {
                format: "CODE128",
                lineColor: "#000000",
                width: 1.2,
                height: 40,
                displayValue: false,
                margin: 0,
            });
        })();
    </script>
</body>
</html>
