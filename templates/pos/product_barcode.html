<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Barcode for {{ product.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 16px;
        }
        .label {
            width: 60mm;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .name {
            font-size: 11px;
            font-weight: 600;
            text-align: center;
        }
        .code-text {
            font-size: 11px;
            letter-spacing: 0.08em;
        }
        .actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid #0f172a;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-secondary {
            background: #fff;
            color: #0f172a;
        }
        @media print {
            body {
                padding: 0;
            }
            .actions {
                display: none;
            }
            .label {
                border: none;
            }
        }
    </style>
</head>
<body>

    <div class="label">
        <div class="name">{{ product.name }}</div>
        <svg id="barcode"></svg>
        <div class="code-text">#{{ product.code }}</div>
    </div>

    <div class="actions">
        <button class="btn" onclick="window.print()">Print</button>
        <button class="btn btn-secondary" onclick="window.close()">Close</button>
    </div>

    <script>
        (function () {
            const code = "{{ product.code }}";
            if (!code) return;
            JsBarcode("#barcode", code, {
                format: "CODE128",
                lineColor: "#000000",
                width: 1.2,
                height: 40,
                displayValue: false,
                margin: 0,
            });
        })();
    </script>
</body>
</html>
