{% extends "base.html" %}
{% load pos_filters %}
{% block content %}

<div class="max-w-3xl mx-auto p-6">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold">Edit Product</h1>
                <p class="text-sm text-slate-500">Update name and cost price.</p>
            </div>
            <a href="{% url 'products' %}"
               class="px-4 py-2 rounded-lg border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50">
                Back
            </a>
        </div>

        <div class="p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Name</label>
                    <input type="text" name="name" value="{{ product.name }}" required
                           class="w-full border border-slate-200 p-3 rounded-xl text-base bg-white">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Cost price</label>
                    <input type="number" step="1" min="0" name="cost_price" value="{{ product.cost_price|whole }}" required
                           class="w-full border border-slate-200 p-3 rounded-xl text-base bg-white">
                    <div class="text-xs text-slate-500 mt-1">Whole numbers only.</div>
                </div>

                <div class="flex gap-3">
                    <button type="submit"
                            class="bg-slate-900 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-slate-800">
                        Save Changes
                    </button>
                    <a href="{% url 'products' %}"
                       class="bg-slate-100 text-slate-800 px-6 py-3 rounded-xl text-base font-extrabold hover:bg-slate-200">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
