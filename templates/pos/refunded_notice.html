{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto p-6 text-center">

    <div class="bg-white p-6 rounded-2xl border border-red-200 shadow-sm">

        <h1 class="text-2xl md:text-3xl font-extrabold text-red-800 mb-4 tracking-tight">
            ORDER REFUNDED
        </h1>

        <p class="text-base mb-4 text-slate-800">
            Order #{{ order.order_number }} was refunded.
        </p>

        <p class="text-sm text-red-900 mb-6 font-semibold">
            This order cannot be reprinted.
        </p>

        <a href="{% url 'pos_home' %}"
           class="bg-slate-900 text-white px-6 py-3 rounded-xl text-base font-extrabold hover:bg-slate-800">
            Back to POS
        </a>

    </div>
</div>

{% endblock %}
