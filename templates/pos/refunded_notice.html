{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto p-6 text-center">

    <div class="bg-red-100 p-6 rounded shadow">

        <h1 class="text-3xl font-bold text-red-700 mb-4">
            ORDER REFUNDED
        </h1>

        <p class="text-xl mb-4">
            Order #{{ order.order_number }} was refunded.
        </p>

        <p class="text-lg text-red-800 mb-6">
            This order cannot be reprinted.
        </p>

        <a href="{% url 'pos_home' %}"
           class="bg-gray-700 text-white px-6 py-3 rounded text-xl font-bold">
            Back to POS
        </a>

    </div>
</div>

{% endblock %}
