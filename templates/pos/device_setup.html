{% extends "base.html" %}
{% block content %}

<div class="max-w-xl mx-auto p-6">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200">
            <h1 class="text-2xl font-extrabold text-slate-900">Device Setup</h1>
            <p class="text-sm text-slate-600 mt-1">
                Set this cashier PC’s <span class="font-semibold">Device ID</span> so print jobs target the correct USB printer.
            </p>
        </div>

        <div class="p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Device ID</label>
                    <input type="text" name="device_id" value="{{ device_id }}" placeholder="cashier-1" required
                           class="w-full border border-slate-200 px-4 py-3 rounded-xl text-base bg-white">
                    <div class="text-xs text-slate-500 mt-2">
                        Examples: <span class="font-semibold">cashier-1</span>, <span class="font-semibold">cashier-2</span>
                    </div>
                </div>

                <button type="submit"
                        class="w-full rounded-2xl bg-slate-600 text-white px-6 py-3 text-lg font-extrabold hover:bg-slate-700">
                    Save Device ID
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
